
name: MacRDP

on:
  workflow_dispatch:

jobs:
  build:
    name: MacRDP
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Enabling Remote Access
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          echo "Checking remote access configuration..."
          test -n "$NGROK_AUTH_TOKEN"

      - name: Log In Details To VNC Server
        run: |
          if [ -f login.sh ]; then
            chmod +x login.sh
            bash login.sh
          else
            echo "login.sh not found"
            exit 1
          fi

      - name: Check macOS
        run: |
          sw_vers
          whoami

      - name: MacOS System running...
        run: |
          echo "macOS job is running."
