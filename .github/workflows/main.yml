
name: MacRDP

on:
  workflow_dispatch:

jobs:
  build:
    name: MacRDP
    runs-on: macos-latest
    timeout-minutes: 350

    steps:
      - name: Download Scripts
        run: |
          curl -fL \
            "https://raw.githubusercontent.com/ryzexnightcore-cmyk/rdpa/main/start.sh" \
            -o start.sh

          curl -fL \
            "https://raw.githubusercontent.com/ryzexnightcore-cmyk/rdpa/main/login.sh" \
            -o login.sh

          chmod +x start.sh login.sh

      - name: Enable Remote Access
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          bash start.sh "$NGROK_AUTH_TOKEN"

      - name: Display Login Details
        run: |
          bash login.sh

      - name: Keep Session Running
        run: |
          echo "MacRDP session started."
          sleep 20500
